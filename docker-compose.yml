services:
  postgres:
    image: postgres:15-alpine
    container_name: rentease-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5436:5432'
    volumes:
      - rentease_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rentease-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rentease-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-production}
    networks:
      - rentease-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rentease-client
    restart: unless-stopped
    ports:
      - '5173:5173'
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:3000
    networks:
      - rentease-network

volumes:
  rentease_postgres_data:

networks:
  rentease-network:
    driver: bridge
