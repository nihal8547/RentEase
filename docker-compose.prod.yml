services:
  postgres:
    image: postgres:15-alpine
    container_name: rentease-postgres-prod
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rentease_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentease-prod-network

  redis:
    image: redis:7-alpine
    container_name: rentease-redis-prod
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - rentease_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentease-prod-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rentease-server-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3021:3000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://rentease.webbea.qa}
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@rentease.qa}
    networks:
      - rentease-prod-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    container_name: rentease-client-prod
    restart: always
    ports:
      - "127.0.0.1:3020:80"
    depends_on:
      - server
    networks:
      - rentease-prod-network

volumes:
  rentease_prod_postgres_data:
  rentease_prod_redis_data:

networks:
  rentease-prod-network:
    driver: bridge
