services:
  postgres:
    image: postgres:15-alpine
    container_name: rentease-postgres-prod
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rentease_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentease-prod-network

  # Fix 7: Redis for BullMQ job queues
  redis:
    image: redis:7-alpine
    container_name: rentease-redis-prod
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - rentease_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentease-prod-network

  # Fix 12: One-off migration job runs before server starts (prevents race condition)
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rentease-migrate-prod
    restart: "no"
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    networks:
      - rentease-prod-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rentease-server-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://app.rentease.qa}
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@rentease.qa}
    networks:
      - rentease-prod-network

  # Fix 11: Nginx reverse proxy — handles HTTPS termination, SPA routing, API proxying
  nginx:
    image: nginx:alpine
    container_name: rentease-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro    # Mount your SSL certificate files here
      - rentease_prod_static:/usr/share/nginx/html:ro
    depends_on:
      - server
    networks:
      - rentease-prod-network

volumes:
  rentease_prod_postgres_data:
  rentease_prod_redis_data:
  rentease_prod_static:

networks:
  rentease-prod-network:
    driver: bridge
